<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zesto 考试</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Zesto" class="logo-img" />
      <div>
        <div>Zesto</div>
        <div class="sub" data-i18n="examTitle">考试进行中</div>
      </div>
    </div>
    <div class="lang-switch">
      <button data-lang="zh">中文</button>
      <button data-lang="pt">Português</button>
    </div>
  </div>

  <div class="wrap wrap-wide">
    <div class="exam-bar">
      <div class="exam-meta">
        <span class="tag part" data-i18n="timeLeft"></span>
        <span id="timer" class="timer">30:00</span>
        <span class="tag" id="progress">—</span>
      </div>
      <button class="btn submit" id="submitBtn" data-i18n="submitBtn" style="display:none"></button>
    </div>

    <div id="quizBox" class="quiz-box">
      <div class="card"><p class="hint" data-i18n="loading"></p></div>
    </div>

    <div class="footer-note">Zesto Sales Training · 九部曲认证考试</div>
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/quiz.js"></script>
</body>
</html>
